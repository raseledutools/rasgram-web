<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RasGram Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-circle">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </div>
        <h1 class="app-name"><span style="color:#E9EDEF">Ras</span><span style="color:#00A884">Gram</span></h1>
        <p class="tagline">Web Edition</p>
      </div>

      <!-- Step 0: Phone Number -->
      <div id="step-phone" class="step active">
        <p class="step-label">Enter your phone number</p>
        <div class="phone-row">
          <select id="country-code" class="country-select">
            <option value="+880">🇧🇩 +880</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+966">🇸🇦 +966</option>
          </select>
          <input id="phone-input" type="tel" class="text-input" placeholder="Phone number" maxlength="11" />
        </div>
        <div id="recaptcha-container"></div>
        <button id="send-otp-btn" class="primary-btn" onclick="sendOtp()">
          <span id="send-otp-text">Continue</span>
          <span id="send-otp-loader" class="loader hidden"></span>
        </button>
      </div>

      <!-- Step 1: Name -->
      <div id="step-name" class="step hidden">
        <p class="step-label">What's your name?</p>
        <input id="name-input" type="text" class="text-input full" placeholder="Your name" maxlength="25" />
        <div class="btn-row">
          <button class="secondary-btn" onclick="goBack(0)">← Back</button>
          <button class="primary-btn" onclick="goToOtp()">Continue →</button>
        </div>
      </div>

      <!-- Step 2: OTP -->
      <div id="step-otp" class="step hidden">
        <p class="step-label">Enter 6-digit verification code</p>
        <p class="sub-label" id="otp-phone-label"></p>
        <div class="otp-boxes">
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,0)" onkeydown="otpKey(this,event,0)" />
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,1)" onkeydown="otpKey(this,event,1)" />
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,2)" onkeydown="otpKey(this,event,2)" />
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,3)" onkeydown="otpKey(this,event,3)" />
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,4)" onkeydown="otpKey(this,event,4)" />
          <input class="otp-box" type="tel" maxlength="1" oninput="otpInput(this,5)" onkeydown="otpKey(this,event,5)" />
        </div>
        <p id="otp-error" class="error-msg hidden"></p>
        <div class="btn-row">
          <button class="secondary-btn" onclick="goBack(1)">← Back</button>
          <button id="verify-btn" class="primary-btn" onclick="verifyOtp()">
            <span id="verify-text">Verify</span>
            <span id="verify-loader" class="loader hidden"></span>
          </button>
        </div>
        <p class="resend-text">Didn't receive? <span id="resend-countdown" class="countdown">60s</span>
          <a id="resend-link" class="link hidden" onclick="resendOtp()">Resend</a>
        </p>
      </div>

      <div class="secure-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#00A884"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        End-to-end encrypted
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
